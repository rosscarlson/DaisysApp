# Push a product's tag (its TagPrefix and version, e.g. sea-v0.2.0 for SimEffects Analysis: products/<Name>/product.json)
# to build its installer and publish its release. The release is never marked latest, so Daisy's App's updater (which
# reads the latest release) never sees it; the product's own updater reads only releases with its prefix. Daisy's
# App's tags (v*) don't start this, nor does this start Daisy's App's (release.yml).
name: Release product

on:
  push:
    tags: ['*-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which product
        id: product
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $found = Get-ChildItem products/*/product.json | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json } |
            Where-Object { $tag.StartsWith($_.TagPrefix) } | Select-Object -First 1
          if (-not $found) { throw "No product in products/ has a TagPrefix for $tag" }
          $v = $tag.Substring($found.TagPrefix.Length)
          if ($v -ne $found.Version) { throw "$tag doesn't match $($found.Name)'s product.json version ($($found.Version))" }
          "name=$($found.Name)" >> $env:GITHUB_OUTPUT
          "title=$($found.Title)" >> $env:GITHUB_OUTPUT
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        env:
          # the app's Google OAuth client for YouTube's sign-in (Core's YouTube.AppClient), kept out of the source
          YOUTUBE_CLIENT: ${{ secrets.YOUTUBE_CLIENT }}
        run: ./build.ps1 -Product '${{ steps.product.outputs.name }}' -Version '${{ steps.product.outputs.version }}'

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = '${{ steps.product.outputs.name }}'; $v = '${{ steps.product.outputs.version }}'
          $setup = Get-Item "artifacts/$name-Setup-$v.exe"
          # the notes: this version's section of the product's CHANGELOG.md
          $log = Get-Content "products/$name/CHANGELOG.md" -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\s*$(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Version $v" }
          Set-Content notes.md $notes -Encoding utf8
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload '${{ github.ref_name }}' $setup.FullName --clobber }
          else { gh release create '${{ github.ref_name }}' $setup.FullName --title "${{ steps.product.outputs.title }} $v" --notes-file notes.md --latest=false }
