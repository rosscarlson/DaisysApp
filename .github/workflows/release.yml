# Push a tag like v0.2.0 to build the installers and publish a GitHub Release.
# The app's auto-updater reads the latest release and downloads its DaisysApp-Setup-*.exe asset (the wrapper its
# Wrapper-Setup-*.exe). The wrapper downloads its modules from its own version's release: Module-<name>-*.zip, listed
# in Modules-*.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./build.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $files = @(Get-ChildItem "artifacts/*-Setup-$v.exe") + @(Get-ChildItem "artifacts/Module-*-$v.zip") + @(Get-ChildItem "artifacts/Modules-$v.json")
          gh release create '${{ github.ref_name }}' $files.FullName --title "Daisy's App $v" --generate-notes
